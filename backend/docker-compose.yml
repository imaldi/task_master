services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task_master_backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_USER=majid
      - DB_PASSWORD=majid
      - DB_NAME=mydb
      - DB_SSLMODE=disable
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

